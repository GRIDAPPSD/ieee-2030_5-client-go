# Runner-tag discipline: all jobs in this repo run on the forge runner pool.
# Three runners are visible to arista/ieee-2030_5/: 3834 (forge-dind),
# 3835 (forge-gpu), and 3836 (forge). All have run_untagged: false.
# The default tag is [forge]. Jobs MUST carry tags: [forge] to be claimed.

stages: [verify]

verify:
  stage: verify
  image: golang:1.26
  tags: [forge]
  # coverage regex: matches the single "total:" line emitted by go tool cover -func,
  # giving the true project-wide statement coverage percentage.
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  # B-F window: clone core to the path the go.mod replace directive expects.
  # Uses CI_JOB_TOKEN (auto-provisioned, ephemeral, masked) so no personal PAT
  # is stored in the runner .git/config or leaked via git error output.
  # Core's project must allowlist this project's job token (handled by Leon).
  # Both this before_script and the replace directive are removed in Phase F
  # when core v1.0.0 publishes and the replace flips to a real version reference.
  before_script:
    - mkdir -p /home/debian/repos
    - git clone --depth=1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.pnnl.gov/arista/ieee-2030_5/ieee-2030_5-core.git /home/debian/repos/ieee-2030_5-core
  script:
    - go vet ./...
    - go build ./...
    - go test ./... -coverprofile=coverage.out
    - go tool cover -func coverage.out
    - go test -race ./...
