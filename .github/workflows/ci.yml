# CI workflow scaffold, GRIDAPPSD-module CI token wiring.
# Mirrors the pattern shipped for the server (GRIDAPPSD/ieee-2030_5-server-go#191):
# a GitHub App installation
# token mints short-lived, org-scoped access so
# `go build`/`go vet`/`go test` can resolve the
# github.com/GRIDAPPSD/ieee-2030_5-core-go module.
#
# Standard Go signal only at this stage: build, vet, test. No lint step
# is included because this repo carries no .golangci.yml/.golangci.yaml
# yet; add one (and a matching golangci-lint-action step) when that
# config lands, per the server's pattern.
#
# Runner: ubuntu-latest. This is a documented exception to the
# workspace `runs-on: self-hosted` policy, see .claude/rules/devops.md.
# Rationale: third-party-org repo (GRIDAPPSD), test-only CI (no deploy,
# no secrets exposed to build steps beyond the App token, no docker push).
# Self-hosted is reserved for projects with deploy-bearing CI.

name: ci

on:
  # paths-ignore: doc-only changes do not affect build artifacts in this
  # repo. See .claude/rules/devops.md "Documentation-only changes should
  # not trigger a full CI rebuild", invert this list if docs ever
  # become part of the build.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run (e.g. "re-attestation against SHA xyz")'
        required: false
        default: 'manual'

# Cancel in-flight runs for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: build / vet / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Required so `go` resolves github.com/GRIDAPPSD/* over the
      # token-authenticated git insteadOf rewrite below, instead of
      # trying (and failing) an anonymous proxy/checksum-db lookup.
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Python sidecar steps run before the App token is minted and
      # written into git config, below. pip install runs arbitrary
      # third-party code (setup hooks, and the packages themselves), so
      # it never runs while an org-scoped credential sits in git config;
      # --require-hashes still bounds what network content pip will even
      # install, but ordering removes the exposure window regardless.
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore GridLAB-D sidecar wheel cache
        # Keyed on both lock files and the resolved Python version:
        # numpy and nanobind-backend ship per-CPython-minor wheels
        # (unlike gridlabd's stable-ABI cp310-abi3 wheel), so a Python
        # version bump must start from an empty cache, not reuse a
        # wheel built for a different interpreter. On a hit, the install
        # step below never contacts PyPI (--no-index --find-links); on a
        # miss it downloads once.
        uses: actions/cache@v6
        with:
          path: sim/gridlabd/.wheelhouse
          key: gldsidecar-wheelhouse-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('sim/gridlabd/requirements.lock', 'sim/gridlabd/requirements-dev.lock') }}

      - name: Install the pinned GridLAB-D sidecar (hash-locked)
        # gridlabd==6.0.0a1 is a pre-release; an exact == pin installs it
        # with no --pre (verified 2026-09-29). --require-hashes rejects a
        # tampered or substituted wheel instead of installing it, so a run
        # is red the moment the pin or the network copy stops matching.
        # The test runner (pytest and its closure) is hash-locked the
        # same way, in requirements-dev.lock, so nothing installed here
        # is unpinned. No `pip install --upgrade pip`: this step installs
        # only what its two lock files name.
        run: |
          set -eu
          cd sim/gridlabd
          python -m venv .venv
          if [ ! -f .wheelhouse/.populated ]; then
            .venv/bin/pip download --require-hashes -r requirements.lock -r requirements-dev.lock -d .wheelhouse
            touch .wheelhouse/.populated
          fi
          .venv/bin/pip install --no-index --find-links .wheelhouse --require-hashes -r requirements.lock -r requirements-dev.lock
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the sidecar's own tests
        # The real pinned gridlabd runs here, every CI run: no fake, no
        # skip. A run whose install step above fails never reaches this
        # step, so an install failure is red on its own step.
        run: sim/gridlabd/.venv/bin/python -m pytest sim/gridlabd/tests -q

      - name: Mint GitHub App installation token
        # Mints a short-lived installation token for the GRIDAPPSD App
        # (referenced by App ID via secret, not by slug) so
        # `go build`/`go vet`/`go test` below
        # can resolve the github.com/GRIDAPPSD/ieee-2030_5-core-go
        # module. Pinned to v3 (current stable major as of 2026-07-07).
        # The action masks the token in logs; it is never echoed.
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD

      - name: Configure module access
        # Rewrites HTTPS clones/fetches of github.com/GRIDAPPSD/* to carry
        # the minted installation token, scoped to this org only. Runs
        # before Setup Go so `go build`'s module resolution can see it.
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/GRIDAPPSD/".insteadOf "https://github.com/GRIDAPPSD/"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        # GLDSIDECAR_INTEGRATION_REQUIRED makes the real-sidecar test fail
        # rather than silently skip when gridlabd is not importable, so a
        # green run here is evidence that test actually executed against
        # the venv installed above, not that it was skipped with no other
        # sign in a log this step does not run with -v.
        env:
          GLDSIDECAR_INTEGRATION_REQUIRED: "1"
        run: go test ./...

  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No App token here: gofmt -l only reads and parses the local tree,
    # it never resolves a Go module or touches network.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          # This repo has no gofmt violations today (verified 2026-08-02),
          # so the check is unconditionally blocking. If a future
          # vendored or generated file needs a carve-out, add it here
          # narrowly and comment why, matching the pattern in
          # ieee-2030_5-core-go's ci.yml gofmt job.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt check passed."
