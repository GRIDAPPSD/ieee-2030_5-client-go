name: "CodeQL"

# Static analysis for Go, additive to ci.yml's build/vet/test/gofmt
# gate. Runs on pull_request (so findings gate merge review) and on a
# weekly schedule (so a newly-published CodeQL query pack catches
# something in code that has not itself changed). Deliberately NOT on
# every push to every branch: PRs into main are already gated, and a
# push-triggered run on top of the PR run would double the analysis
# cost for no additional signal. See .claude/rules/devops.md "GitHub
# Actions" for the GitHub-hosted-runner posture this follows; this is
# read-only static analysis with no deploy reach.
#
# Requires GitHub Advanced Security to be enabled for this repository:
# Settings > Code security and analysis > "GitHub Advanced Security".
# This repo is private, so code scanning does not run without it; the
# analyze step's SARIF upload fails closed with "Advanced Security must
# be enabled for this repository to use code scanning" if it is off.
# Verified 2026-08-02 via
# `gh api repos/GRIDAPPSD/ieee-2030_5-client-go/code-scanning/alerts`: Advanced
# Security is NOT currently enabled on this repo (403, that exact
# message). A human must turn it on in Settings before this workflow's
# results become visible in the Security tab.
#
# permissions carries `actions: read` in addition to the
# `contents: read` and `security-events: write` the CodeQL Action's own
# README documents as the minimum for a private repo. The analyze
# step's SARIF post-processing (fingerprinting alerts before upload)
# calls `GET /repos/:owner/:repo/actions/runs/:run_id` to resolve the
# workflow's relative path; without `actions: read` that call fails
# with "Resource not accessible by integration" AFTER the database
# builds and the SARIF exports successfully, so the job fails late and
# the SARIF is never uploaded to code scanning. Confirmed by reading
# github/codeql-action's own source (api-client.ts
# getWorkflowRelativePath, called from upload-lib.ts during
# fingerprinting), not just the error text. First observed on
# ieee-2030_5-core-go PR #12, run 30764072952: the database build, all
# queries, and the SARIF export all succeeded; only this late API call
# failed, so nothing was ever uploaded on that run despite the earlier
# steps going green.
#
# This module depends on the private
# github.com/GRIDAPPSD/ieee-2030_5-core-go module, so CodeQL's
# Autobuild step needs the same GitHub App installation token wiring
# ci.yml already carries to resolve it. The token minted here is scoped
# more narrowly than ci.yml's existing step (repositories: and
# permission-contents: read added), matching the tighter pattern used
# in the sibling gridappsd-ieee-2030_5-go repo.

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC. Catches newly-published CodeQL query-pack
    # findings against code that has not itself changed.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            ieee-2030_5-core-go
          permission-contents: read

      - name: Configure private module access
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"

      - name: Disable git background maintenance
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
