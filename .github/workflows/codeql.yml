name: "CodeQL"

# Static analysis for Go, additive to ci.yml's build/vet/test/gofmt
# gate. Runs on pull_request (so findings gate merge review) and on a
# weekly schedule (so a newly-published CodeQL query pack catches
# something in code that has not itself changed). Deliberately NOT on
# every push to every branch: PRs into main are already gated, and a
# push-triggered run on top of the PR run would double the analysis
# cost for no additional signal. See .claude/rules/devops.md "GitHub
# Actions" for the GitHub-hosted-runner posture this follows; this is
# read-only static analysis with no deploy reach.
#
# Requires GitHub Advanced Security to be enabled for this repository:
# Settings > Code security and analysis > "GitHub Advanced Security".
# This repo is private, so code scanning does not run without it; the
# analyze step's SARIF upload fails closed with "Advanced Security must
# be enabled for this repository to use code scanning" if it is off.
# Verified 2026-08-02 via
# `gh api repos/GRIDAPPSD/ieee-2030_5-client-go/code-scanning/alerts`: Advanced
# Security is NOT currently enabled on this repo (403, that exact
# message). A human must turn it on in Settings before this workflow's
# results become visible in the Security tab.
#
# permissions carries `actions: read` in addition to the
# `contents: read` and `security-events: write` the CodeQL Action's own
# README documents as the minimum for a private repo. The analyze
# step's SARIF post-processing (fingerprinting alerts before upload)
# calls `GET /repos/:owner/:repo/actions/runs/:run_id` to resolve the
# workflow's relative path; without `actions: read` that call fails
# with "Resource not accessible by integration" AFTER the database
# builds and the SARIF exports successfully, so the job fails late and
# the SARIF is never uploaded to code scanning. Confirmed by reading
# github/codeql-action's own source (api-client.ts
# getWorkflowRelativePath, called from upload-lib.ts during
# fingerprinting), not just the error text. First observed on
# ieee-2030_5-core-go PR #12, run 30764072952: the database build, all
# queries, and the SARIF export all succeeded; only this late API call
# failed, so nothing was ever uploaded on that run despite the earlier
# steps going green.
#
# This module depends on the private
# github.com/GRIDAPPSD/ieee-2030_5-core-go module, so CodeQL's
# Autobuild step needs the same GitHub App installation token wiring
# ci.yml already carries to resolve it. The token minted here is scoped
# more narrowly than ci.yml's existing step (repositories: and
# permission-contents: read added), matching the tighter pattern used
# in the sibling gridappsd-ieee-2030_5-go repo.
#
# GATED ON REPOSITORY VISIBILITY (2026-08-02): confirmed via
# `gh api -X PATCH repos/GRIDAPPSD/ieee-2030_5-core-go
# -f security_and_analysis[advanced_security][status]=enabled` that the
# blocker above is not a setting, it is a purchase: the response was
# 422 "Advanced security has not been purchased," with admin:true
# already held on the repo. The org is on GitHub Free; GHAS (private-
# repo code scanning) is an Enterprise product and is free only for
# PUBLIC repos. Craig's call: these repos go public eventually, at
# which point CodeQL works for free with no further changes needed
# here. Until then, the check-visibility job below resolves this
# repo's actual visibility via the API (works identically on every
# trigger, including `schedule`, where
# `github.event.repository.visibility` does not exist) and the
# analyze job is gated on it being "public". This is a SKIP, not
# `continue-on-error`: a skipped job costs nothing and reports
# honestly; a job that ran and quietly failed to upload would report a
# misleading green. Do not delete this job as dead config: it
# self-activates the day this repo's visibility flips, with no
# further edits required.

on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC. Catches newly-published CodeQL query-pack
    # findings against code that has not itself changed.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  check-visibility:
    name: Check repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_public: ${{ steps.visibility.outputs.is_public }}
    steps:
      - name: Resolve repository visibility
        # Queries the API directly rather than reading
        # github.event.repository.visibility: that field exists on
        # pull_request and push payloads but not on schedule, and this
        # workflow's weekly cron run has no repository payload to read
        # it from at all. The API call works identically on every
        # trigger. github.token (the default GITHUB_TOKEN) can always
        # read this repository's own visibility; no elevated
        # permission or App token is needed for this one read.
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          echo "Repository visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "is_public=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_public=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (Go)
    needs: check-visibility
    # Skip, not continue-on-error: GHAS code scanning is free only for
    # public repos (see the header comment above). A skipped job costs
    # no runner minutes and reports honestly in the checks list; a job
    # that ran anyway would fail late on the SARIF upload, or with
    # continue-on-error would report a green check for an analysis
    # that uploaded nothing, either of which is worse than an honest
    # skip. Nothing else here needs editing when this repo goes
    # public: this condition alone starts running the job again.
    if: needs.check-visibility.outputs.is_public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      GOPRIVATE: github.com/GRIDAPPSD/*
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GRIDAPPSD_CI_APP_ID }}
          private-key: ${{ secrets.GRIDAPPSD_CI_APP_PRIVATE_KEY }}
          owner: GRIDAPPSD
          repositories: |
            ieee-2030_5-core-go
          permission-contents: read

      - name: Configure private module access
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${APP_TOKEN}@github.com/GRIDAPPSD/".insteadOf \
            "https://github.com/GRIDAPPSD/"

      - name: Disable git background maintenance
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
